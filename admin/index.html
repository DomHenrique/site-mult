<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo | Mult Serviços de Engenharia</title>
  
  <link rel="icon" type="image/png" href="../assets/logo/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mult: {
              dark: '#1D0B44',
              navy: '#12052c',
              violet: '#6600CC'
            }
          },
          fontFamily: {
            heading: ['"Plus Jakarta Sans"', 'sans-serif'],
            body: ['"Inter"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    /* Custom admin styles */
    .admin-nav-item.active {
      background: linear-gradient(90deg, rgba(102, 0, 204, 0.25) 0%, rgba(76, 29, 149, 0.15) 100%);
      color: #FFFFFF;
      border-left: 3px solid #8B5CF6;
    }
  </style>
</head>
<body class="h-full text-slate-200 font-body flex overflow-hidden">

  <!-- ========================================================================
       SIDEBAR NAVIGATION
       ======================================================================== -->
  <aside id="adminSidebar" class="w-64 bg-[#0F0426] border-r border-white/10 flex flex-col justify-between shrink-0 transition-all duration-300 z-30">
    
    <!-- Top Branding -->
    <div>
      <div class="h-20 flex items-center px-6 border-b border-white/10">
        <a href="../index.html" target="_blank" class="flex items-center gap-3">
          <img src="../assets/logo/mult-logo-white.png" alt="Mult Engenharia" class="h-9 w-auto object-contain" />
        </a>
      </div>

      <!-- Navigation Links -->
      <div class="px-3 py-6 space-y-1.5 text-sm font-semibold">
        
        <button data-module="dashboard" class="admin-nav-item active w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:text-white hover:bg-white/5 transition text-left">
          <i class="ri-dashboard-3-line text-lg text-purple-400"></i>
          <span>Dashboard Geral</span>
        </button>

        <button data-module="banners" class="admin-nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:text-white hover:bg-white/5 transition text-left">
          <i class="ri-slideshow-3-line text-lg text-purple-400"></i>
          <span>Banners do Hero</span>
        </button>

        <button data-module="projetos" class="admin-nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:text-white hover:bg-white/5 transition text-left">
          <i class="ri-briefcase-4-line text-lg text-purple-400"></i>
          <span>Projetos em Destaque</span>
        </button>

        <button data-module="equipe" class="admin-nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:text-white hover:bg-white/5 transition text-left">
          <i class="ri-team-line text-lg text-purple-400"></i>
          <span>Equipe Mult</span>
        </button>

        <button data-module="leads" class="admin-nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:text-white hover:bg-white/5 transition text-left">
          <i class="ri-mail-unread-line text-lg text-purple-400"></i>
          <span>Leads & Contatos</span>
        </button>

        <!-- Exclusive SuperAdmin Module -->
        <div id="superadminMenuSection" class="pt-4 border-t border-white/10">
          <span class="px-4 text-[10px] font-extrabold uppercase tracking-widest text-purple-300/60 block mb-2">
            Administração Geral
          </span>
          <button data-module="usuarios" class="admin-nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:text-white hover:bg-white/5 transition text-left">
            <i class="ri-shield-user-line text-lg text-amber-400"></i>
            <span>Gestão de Usuários</span>
          </button>
        </div>

      </div>
    </div>

    <!-- User Profile & Logout Bottom Bar -->
    <div class="p-4 border-t border-white/10 bg-white/[0.02]">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3 overflow-hidden">
          <div class="w-10 h-10 rounded-xl bg-purple-600/30 border border-purple-500/30 flex items-center justify-center font-bold text-white shrink-0 text-sm">
            <i class="ri-user-line"></i>
          </div>
          <div class="overflow-hidden">
            <p id="userNameDisplay" class="text-xs font-bold text-white truncate">Carregando...</p>
            <span id="userRoleBadge" class="text-[10px] font-semibold text-purple-300 uppercase tracking-wider block">Admin</span>
          </div>
        </div>
        <button id="logoutBtn" title="Sair do Painel" class="p-2 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 transition">
          <i class="ri-logout-box-r-line text-lg"></i>
        </button>
      </div>
    </div>

  </aside>

  <!-- ========================================================================
       MAIN APPLICATION VIEWPORT
       ======================================================================== -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden bg-[#0A021A]">
    
    <!-- Top Navbar Bar -->
    <header class="h-20 bg-[#0F0426]/80 backdrop-blur-md border-b border-white/10 px-6 sm:px-8 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-4">
        <h2 id="pageTitle" class="text-lg font-heading font-extrabold text-white">
          Dashboard Geral
        </h2>
      </div>

      <div class="flex items-center gap-4">
        <a href="../index.html" target="_blank" class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-bold text-slate-300 hover:text-white flex items-center gap-2 transition">
          <i class="ri-external-link-line"></i> Ver Site
        </a>
      </div>
    </header>

    <!-- Mobile Screen Advisory Banner (Recommending Desktop) -->
    <div id="mobileAdvisoryBanner" class="lg:hidden bg-gradient-to-r from-amber-500/15 via-purple-900/40 to-amber-500/15 border-b border-amber-500/30 px-4 sm:px-6 py-2.5 text-amber-200 text-xs flex items-center justify-between gap-3 shadow-sm shrink-0">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-7 h-7 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0 border border-amber-500/30">
          <i class="ri-computer-line text-sm"></i>
        </div>
        <p class="leading-tight text-[11px] sm:text-xs">
          <strong>Dica de Produtividade:</strong> Para uma melhor experiência de visualização, uploads pesados e edição precisa de layouts, recomendamos utilizar um computador.
        </p>
      </div>
      <button id="dismissMobileBannerBtn" title="Dispensar aviso" class="text-amber-300 hover:text-white p-1 rounded-md hover:bg-white/10 shrink-0 transition">
        <i class="ri-close-line text-base"></i>
      </button>
    </div>

    <!-- Content Workspace -->
    <main id="mainContainer" class="flex-1 overflow-y-auto p-6 sm:p-8">
      <!-- Injected by admin-app.js based on active module -->
      <div class="flex items-center justify-center h-64 text-purple-300">
        <i class="ri-loader-4-line animate-spin text-3xl"></i>
      </div>
    </main>

  </div>

  <!-- Scripts -->
  <script src="../js/api-client.js?v=2.0"></script>
  <script src="js/admin-auth.js?v=2.0"></script>
  <script src="js/admin-banners.js?v=2.0"></script>
  <script src="js/admin-hero.js?v=2.0"></script>
  <script src="js/admin-projetos.js?v=2.2"></script>
  <script src="js/admin-equipe.js?v=2.0"></script>
  <script src="js/admin-usuarios.js?v=2.0"></script>
  <script src="js/admin-app.js?v=2.0"></script>
</body>
</html>
